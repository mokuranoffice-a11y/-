<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在留資格認定証明書交付申請（区分P） 入力フォーム</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2433;--sub:#5b6475;--line:#d7dce5;--brand:#1f4e8c;--req:#c62828;--warn:#fff4e5;--warnline:#f0a64a;--ok:#2e7d32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Sans","Meiryo","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:16px;margin:0 12px 0 0;font-weight:600}
header button,header label.btn{background:#fff;color:var(--brand);border:0;border-radius:6px;padding:6px 12px;font-size:14px;cursor:pointer;font-weight:600}
header button.primary{background:#ffd54f;color:#222}
header input[type=file]{display:none}
main{max-width:980px;margin:0 auto;padding:16px}
#status{margin:0 0 12px;padding:10px 14px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
#status:empty{display:none}
#status.bad{background:var(--warn);border-color:var(--warnline)}
#status.good{border-color:var(--ok)}
#status ul{margin:6px 0 0;padding-left:20px}
#status a{color:var(--brand)}
section.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 16px;overflow:hidden}
section.sec>h2{margin:0;padding:10px 14px;font-size:15px;background:#e8eef7;color:var(--brand);display:flex;justify-content:space-between;align-items:center}
section.sec>h2 button{font-size:12px;border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:5px;padding:3px 8px;cursor:pointer}
.row{padding:10px 14px;border-top:1px solid #eef1f5;display:grid;grid-template-columns:300px 1fr;gap:10px}
.row:first-of-type{border-top:0}
.row.extra{display:none}
section.showextra .row.extra{display:grid}
.row.err{background:#fff8f0}
.row.off{display:none!important}
.lab{font-weight:600}
.lab .req{display:inline-block;background:var(--req);color:#fff;font-size:11px;border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:1px}
.lab .cond{display:inline-block;background:#8a94a6;color:#fff;font-size:11px;border-radius:3px;padding:0 5px;margin-left:6px}
.hint{color:var(--sub);font-size:12px;font-weight:400;margin-top:2px}
.ctl input[type=text],.ctl select,.ctl textarea{width:100%;max-width:560px;padding:6px 8px;border:1px solid #b9c1ce;border-radius:6px;font:inherit;background:#fff}
.ctl textarea{min-height:80px}
.ctl .opts{display:flex;flex-wrap:wrap;gap:6px 16px}
.ctl .opts label{display:flex;gap:4px;align-items:center;cursor:pointer}
.ctl .msg{color:var(--req);font-size:12px;margin-top:3px}
.ctl .manual{color:var(--sub);font-size:13px}
.ctl .sub{margin-top:6px}
@media (max-width:720px){.row{grid-template-columns:1fr}}
</style>
</head>

    // 共通の部品（PDF作成ライブラリ・フォント・白紙様式）は assets/ から読む（初回のみ通信、あとはブラウザが保持）
    await loadLibs(PAPER.base);
    [blank, font] = await Promise.all([fetchBin(PAPER.base, PAPER.blank), fetchBin(PAPER.base, "ipagp.ttf")]);
  } else { blank = b64(PAPER.blank); font = b64(PAPER.font); }
  const items = PaperRender.buildItems(PAPER.map, values, DEF.fields);
  return await PaperRender.render(PDFLib, fontkit, blank, font, PAPER.layout, items);
}
// 併願（資格外活動許可・再入国許可）の申請書PDF：「する」を選んだものだけ作る
async function makeAddonPdfs(values) {
  const out = [];
  if (typeof PAPER_X === "undefined") return out;
  for (const x of PAPER_X) {
    if (values[x.ask] !== "する") continue;
    await loadLibs(x.base);
    const [blank, font] = await Promise.all([fetchBin(x.base, x.blank), fetchBin(x.base, "ipagp.ttf")]);
    const items = PaperRender.buildItems(x.map, values, DEF.fields);
    out.push({suffix: x.suffix, bytes: await PaperRender.render(PDFLib, fontkit, blank, font, x.layout, items)});
  }
  return out;
}
async function save() {
  const values = collect();
  const probs = checkAll();
  const nameF = DEF.fields.find(f => /氏名/.test(f.label));
  const name = (nameF && values[nameF.tr]) || "未入力";
  const d = new Date(), ymd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  const data = {format: FORMAT, screen: DEF.screen, screen_key: DEF.screen_key, source_file: DEF.source_file,
    saved_at: d.toISOString(), open_problems: probs.length, values, fill: compile(values)};
  data.status = probs.length ? `要確認${probs.length}件` : "入力完了";
  // 保存は制限しない。足りない項目があればファイル名に件数を出す
  const base = `${name.replace(/[\\/:*?"<>|\s]+/g, "_")}_${DEF.short || DEF.screen_key}_${ymd}${probs.length ? `_要確認${probs.length}件` : ""}`;
  download(new Blob([JSON.stringify(data, null, 1)], {type: "application/json"}), base + ".json");
  const st = $("#status");
  const note = document.createElement("div"); note.style.marginTop = "8px"; note.style.fontWeight = "600";
  note.textContent = `保存しました：${base}.json　（申請書PDFを作成中…）`;
  st.appendChild(note);
  try {
    const pdf = await makePdf(values);
    const extra = await makeAddonPdfs(values);
    for (const x of extra) download(new Blob([x.bytes], {type: "application/pdf"}), base + x.suffix + ".pdf");
    const ex = extra.map(x => `${base}${x.suffix}.pdf`);
    if (pdf || extra.length) { if (pdf) download(new Blob([pdf], {type: "application/pdf"}), base + ".pdf");
      note.textContent = `保存しました：${[base + ".json"].concat(pdf ? [base + ".pdf"] : [], ex).join(" と ")}　→ JSONはZohoの申請履歴に上げ直してください（古いファイルは削除）。`; }
    else note.textContent = `保存しました：${base}.json　→ Zohoの申請履歴に上げ直してください（古いファイルは削除）。`;
  } catch (e) {
    note.textContent = `保存しました：${base}.json　※申請書PDFは作れませんでした（${e.message}）`;
  }
}
// 入管サイトの更新前に保存したファイル（項目の番号が古い）を、項目名で新しい項目に引き継ぐ
function remapOld(data) {
  const vals = data.values || {}, known = new Set(DEF.fields.map(f => f.tr));
  const miss = Object.keys(vals).filter(k => !known.has(k));
  if (!miss.length) return vals;
  const lab = {}; (data.fill || []).forEach(e => { if (e.tr && e.label) lab[e.tr] = e.label; });
  const byLab = {}; DEF.fields.forEach(f => { (byLab[f.label] = byLab[f.label] || []).push(f.tr); });
  const used = new Set(), out = {}; let lost = 0;
  Object.keys(vals).forEach(k => {
    if (known.has(k)) { out[k] = vals[k]; return; }
    const c = byLab[lab[k]];
    const t = c && c.find(x => !used.has(x));
    if (t) { used.add(t); out[t] = vals[k]; } else lost++;
  });
  const n = Object.keys(out).length;
  setTimeout(() => { const st = $("#status"); if (st) { const m = document.createElement("div"); m.style.fontWeight = "600"; m.textContent = `古い形式のファイルを読み込みました（${n}項目を引き継ぎ${lost ? "、" + lost + "項目は引き継げませんでした。画面で確認してください" : ""}）。`; st.appendChild(m); } }, 0);
  return out;
}
function load(data) {
  if (data.format !== FORMAT) { alert("このフォーム用のファイルではありません"); return; }
  if (data.screen_key !== DEF.screen_key) { if (!confirm(`別の申請種類（${data.screen}）のファイルです。読み込みますか？`)) return; }
  const vals = remapOld(data);
  DEF.fields.forEach(f => setVal(f, vals[f.tr]));
  document.querySelectorAll("section.sec").forEach(s => { if ([...s.querySelectorAll(".row.extra")].some(r => { const f = DEF.fields.find(x => x.tr === r.dataset.tr); return !empty(getVal(f)); })) s.classList.add("showextra"); });
  applyDeps(); checkAll();
}

build(); applyDeps();
if (DEF.version) $("#ver").textContent = DEF.version;
if (DEF.site) $("#toIndex").style.display = "";
$("#btnSave").onclick = () => save();
$("#btnCheck").onclick = checkAll;
$("#btnClear").onclick = () => { if (confirm("入力内容をすべて消しますか？")) { build(); applyDeps(); $("#status").className = ""; $("#status").textContent = ""; } };
$("#fileOpen").onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => load(JSON.parse(t))).catch(err => alert("読み込めません: " + err.message)); e.target.value = ""; };
</script>
