<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2433;--sub:#5b6475;--line:#d7dce5;--brand:#1f4e8c;--req:#c62828;--warn:#fff4e5;--warnline:#f0a64a;--ok:#2e7d32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Sans","Meiryo","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:16px;margin:0 12px 0 0;font-weight:600}
header button,header label.btn{background:#fff;color:var(--brand);border:0;border-radius:6px;padding:6px 12px;font-size:14px;cursor:pointer;font-weight:600}
header button.primary{background:#ffd54f;color:#222}
header input[type=file]{display:none}
main{max-width:980px;margin:0 auto;padding:16px}
#status{margin:0 0 12px;padding:10px 14px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
#status:empty{display:none}
#status.bad{background:var(--warn);border-color:var(--warnline)}
#status.good{border-color:var(--ok)}
#status ul{margin:6px 0 0;padding-left:20px}
#status a{color:var(--brand)}
section.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 16px;overflow:hidden}
section.sec>h2{margin:0;padding:10px 14px;font-size:15px;background:#e8eef7;color:var(--brand);display:flex;justify-content:space-between;align-items:center}
section.sec>h2 button{font-size:12px;border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:5px;padding:3px 8px;cursor:pointer}
.row{padding:10px 14px;border-top:1px solid #eef1f5;display:grid;grid-template-columns:300px 1fr;gap:10px}
.row:first-of-type{border-top:0}
.row.extra{display:none}
section.showextra .row.extra{display:grid}
.row.err{background:#fff8f0}
.row.off{display:none!important}
.lab{font-weight:600}
.lab .req{display:inline-block;background:var(--req);color:#fff;font-size:11px;border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:1px}
.lab .cond{display:inline-block;background:#8a94a6;color:#fff;font-size:11px;border-radius:3px;padding:0 5px;margin-left:6px}
.hint{color:var(--sub);font-size:12px;font-weight:400;margin-top:2px}
.ctl input[type=text],.ctl select,.ctl textarea{width:100%;max-width:560px;padding:6px 8px;border:1px solid #b9c1ce;border-radius:6px;font:inherit;background:#fff}
.ctl textarea{min-height:80px}
.ctl .opts{display:flex;flex-wrap:wrap;gap:6px 16px}
.ctl .opts label{display:flex;gap:4px;align-items:center;cursor:pointer}
.ctl .msg{color:var(--req);font-size:12px;margin-top:3px}
.ctl .manual{color:var(--sub);font-size:13px}
.ctl .sub{margin-top:6px}
@media (max-width:720px){.row{grid-template-columns:1fr}}
</style>
</head>

const FORMAT = "kis-online-app/1";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isExtra = f => /(0[2-9])$/.test(f.label);

function build() {
  const root = $("#form"); root.innerHTML = "";
  let secEl = null, secName = null;
  DEF.fields.forEach(f => {
    const secTitle = f.section || "申請内容";
    if (secTitle !== secName) {
      secName = secTitle;
      secEl = document.createElement("section"); secEl.className = "sec";
      secEl.innerHTML = `<h2><span>${esc(secTitle)}</span></h2>`;
      root.appendChild(secEl);
    }
    const row = document.createElement("div");
    row.className = "row" + (isExtra(f) ? " extra" : "");
    row.id = "row_" + f.tr; row.dataset.tr = f.tr;
    const badges = (f.required ? '<span class="req">必須</span>' : "") + (f.conditional ? '<span class="cond">該当時のみ</span>' : "");
    row.innerHTML = `<div class="lab">${esc(f.label)}${badges}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</div><div class="ctl">${control(f)}<div class="msg"></div></div>`;
    secEl.appendChild(row);
    if (isExtra(f) && !secEl.querySelector("h2 button")) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = "2件目以降の欄を表示/隠す";
      b.onclick = () => secEl.classList.toggle("showextra");
      secEl.querySelector("h2").appendChild(b);
    }
  });
  DEF.fields.filter(f => f.virtual).forEach(f => { const r = root.querySelector(`input[name="${f.tr}"][value="しない"]`); if (r) r.checked = true; });
  root.querySelectorAll("input,select,textarea").forEach(el => el.addEventListener("change", () => { applyDeps(); const r = el.closest(".row"); if (r) checkRow(r); }));
}

      return `<select name="${n}"><option value="">（選択してください）</option>${f.options.map(o => `<option value="${esc(o[1])}">${esc(o[1])}</option>`).join("")}</select>`;

      return `<input type="text" name="${n}" placeholder="例）20000123（8桁）" maxlength="8">`;
    case "yearmonth":
      return `<input type="text" name="${n}" placeholder="例）200001（年月6桁）" maxlength="${f.maxlength || 6}">`;
    case "textarea":
      return `<textarea name="${n}" maxlength="${f.maxlength || 600}"></textarea>`;
    case "checkbox":
      return `<div class="opts">${f.checks.map(c => `<label><input type="checkbox" name="${n}" value="${esc(c[1])}">${esc(c[1])}</label>`).join("")}</div>`;
    case "manual":
      return `<div class="manual">入管の画面で直接操作してください（このフォームでは扱いません）</div>`;
    default:
      return `<input type="text" name="${n}"${f.maxlength ? ` maxlength="${f.maxlength}"` : ""}>`;
  }
}

function getVal(f) {
  const n = f.tr, q = s => document.querySelector(s);
  switch (f.kind) {
    case "radio": { const e = q(`input[name="${n}"]:checked`); return e ? e.value : ""; }
    case "radio_text": { const e = q(`input[name="${n}"]:checked`); if (!e) return ""; const d = q(`[name="${n}__detail"]`).value.trim(); return d ? {choice: e.value, detail: d} : e.value; }
    case "birth": { const t = q(`[name="${n}"]`).value.trim(); const m = q(`[name="${n}__mode"]`).value; return (t || m !== "1") ? {mode: m, text: t} : ""; }
    case "checkbox": return [...document.querySelectorAll(`input[name="${n}"]:checked`)].map(e => e.value);
    case "manual": return "";
    default: { const e = q(`[name="${n}"]`); return e ? e.value.trim() : ""; }
  }
}
function setVal(f, v) {
  const n = f.tr, q = s => document.querySelector(s);
  if (v == null) v = "";
  switch (f.kind) {
    case "radio": document.querySelectorAll(`input[name="${n}"]`).forEach(e => e.checked = e.value === v); break;
    case "radio_text": { const c = typeof v === "object" ? v.choice : v; document.querySelectorAll(`input[name="${n}"]`).forEach(e => e.checked = e.value === c); q(`[name="${n}__detail"]`).value = typeof v === "object" ? (v.detail || "") : ""; break; }
    case "birth": q(`[name="${n}__mode"]`).value = (v && v.mode) || "1"; q(`[name="${n}"]`).value = (v && v.text) || (typeof v === "string" ? v : ""); break;
    case "checkbox": document.querySelectorAll(`input[name="${n}"]`).forEach(e => e.checked = Array.isArray(v) && v.includes(e.value)); break;
    case "manual": break;
    default: { const e = q(`[name="${n}"]`); if (e) e.value = v; }
  }
}
const empty = v => v === "" || v == null || (Array.isArray(v) && !v.length);

function validDate(s) {
  if (!/^\d{8}$/.test(s)) return false;
  const y = +s.slice(0,4), m = +s.slice(4,6), d = +s.slice(6,8), dt = new Date(y, m-1, d);
  return y > 1900 && dt.getFullYear() === y && dt.getMonth() === m-1 && dt.getDate() === d;
}
function problems(f, v) {
  const out = [];
  if (f.kind === "manual" || !depOk(f)) return out;
  if (empty(v)) { if (f.required && !f.conditional && !isExtra(f)) out.push("必須項目が空欄です"); return out; }
  const t = typeof v === "string" ? v : (v.text || v.detail || "");
  if (f.kind === "date" && !validDate(t)) out.push("日付は8桁の実在する日付で入力（例 20000123）");
  if (f.kind === "birth") {
    const m = v.mode;
    if (m === "1" && !validDate(t)) out.push("生年月日は8桁の実在する日付で入力");
    if (m === "3" && !/^\d{4}$/.test(t)) out.push("年のみ4桁で入力（例 2001）");
    if (m === "4" && !/^\d{6}$/.test(t)) out.push("年月6桁で入力（例 200101）");
  }
  if (f.kind === "yearmonth" && !/^\d{6}$/.test(t)) out.push("年月6桁で入力（例 200001）");
  if (f.maxlength && typeof v === "string" && [...v].length > f.maxlength) out.push(`${f.maxlength}文字以内にしてください（現在${[...v].length}文字）`);
  if (/郵便番号/.test(f.label) && !/^\d{7}$/.test(t)) out.push("郵便番号は半角数字7桁（ハイフンなし）");
  if (/電話番号/.test(f.label) && !/^\d{1,12}$/.test(t)) out.push("電話番号は半角数字のみ（ハイフンなし）");
  return out;
}
function depOk(f) {
  if (!f.dep) return true;
  const p = DEF.fields.find(x => x.tr === f.dep.tr); if (!p) return true;
  if (p.virtual) return getVal(p) === f.dep.when;
  if (!depOk(p)) return false;
  let v = getVal(p); if (typeof v === "object" && v && v.choice) v = v.choice;
  return !v || String(v).startsWith(f.dep.when);
}
function applyDeps() { DEF.fields.forEach(f => { const r = document.getElementById("row_" + f.tr); if (r) r.classList.toggle("off", !depOk(f)); }); }
function checkRow(row) {
  const f = DEF.fields.find(x => x.tr === row.dataset.tr);
  const p = problems(f, getVal(f));
  row.querySelector(".msg").textContent = p.join(" / ");
  row.classList.toggle("err", p.length > 0);
  return p;
}
function checkAll() {
  const list = [];
  DEF.fields.forEach(f => { const row = document.getElementById("row_" + f.tr); const p = checkRow(row); if (p.length) list.push([f, p]); });
  // メール再入力の一致
  const mails = DEF.fields.filter(f => /メールアドレス/.test(f.label));
  for (let i = 0; i + 1 < mails.length; i++) if (/再入力/.test(mails[i+1].label) && !/再入力/.test(mails[i].label)) {
    const a = getVal(mails[i]), b = getVal(mails[i+1]);
    if (a && a !== b) list.push([mails[i+1], ["上のメールアドレスと一致しません"]]);
  }
  const st = $("#status");
  if (!list.length) { st.className = "good"; st.textContent = "チェックOK：必須の空欄・形式エラーはありません。"; }
  else {
    st.className = "bad";
    st.innerHTML = `要確認 ${list.length}件<ul>${list.map(([f,p]) => `<li><a href="#row_${f.tr}">${esc(f.label)}</a>：${esc(p.join(" / "))}</li>`).join("")}</ul>`;
  }
  return list;
}

function compile(values) {
  const fill = [];
  DEF.fields.forEach(f => {
    const v = values[f.tr];
    if (empty(v) || f.kind === "manual" || f.virtual || !depOk(f)) return;
    const e = {tr: f.tr, label: f.label, kind: f.kind};
    if (f.addon) e.plabel = f.label.replace(/^【[^】]*】/, "");
    if (f.kind === "select") { const o = f.options.find(o => o[1] === v); e.id = f.id; e.text = v; e.code = o ? o[0] : null; }
    else if (f.kind === "radio") { const r = f.radios.find(r => r[2] === v); e.radio_id = r && r[0]; e.text = v; }
    else if (f.kind === "radio_text") { const c = typeof v === "object" ? v.choice : v; const r = f.radios.find(r => r[2] === c); e.radio_id = r && r[0]; e.text = c; if (typeof v === "object" && v.detail) { e.text_id = f.text_id; e.detail = v.detail; } }
    else if (f.kind === "birth") { const r = f.radios.find(r => r[1] === v.mode); e.radio_id = r && r[0]; e.mode = v.mode; e.text_id = f.texts[v.mode] || null; e.value = v.text || ""; }
    else if (f.kind === "checkbox") { e.ids = f.checks.filter(c => v.includes(c[1])).map(c => c[0]); e.text = v; }
    else { e.id = f.id; e.value = v; }
    fill.push(e);
  });
  if ((DEF.addons || []).some(a => getVal(DEF.fields.find(x => x.tr === a.ask)) === "する") && (DEF.addon_common || []).length)
    fill.unshift({tr: "addon_common", label: "同時申請の記載方法（共通項目は同時申請と同じ）", plabel: "同時申請の記載方法について", kind: "checkbox", ids: DEF.addon_common.map(c => c[0]), text: DEF.addon_common.map(c => c[1])});
  return fill;
}
function collect() { const values = {}; DEF.fields.forEach(f => { const v = getVal(f); if (!empty(v)) values[f.tr] = v; }); return values; }

function download(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function loadScript(src) {
  return new Promise((ok, ng) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => ng(new Error(src + " を読み込めません")); document.head.appendChild(s); });
}
async function loadLibs(base) {
  if (typeof PDFLib === "undefined") { await loadScript(base + "pdf-lib.min.js"); await loadScript(base + "fontkit.umd.min.js"); await loadScript(base + "paper_render.js"); }
}
async function fetchBin(base, u) { const r = await fetch(base + u); if (!r.ok) throw new Error(u + " を読み込めません（" + r.status + "）"); return new Uint8Array(await r.arrayBuffer()); }
async function makePdf(values) {
  if (typeof PAPER === "undefined" || !PAPER) return null;
  let blank, font;
  if (PAPER.shared) {
    // 共通の部品（PDF作成ライブラリ・フォント・白紙様式）は assets/ から読む（初回のみ通信、あとはブラウザが保持）
    await loadLibs(PAPER.base);
    [blank, font] = await Promise.all([fetchBin(PAPER.base, PAPER.blank), fetchBin(PAPER.base, "ipagp.ttf")]);
  } else { blank = b64(PAPER.blank); font = b64(PAPER.font); }
  const items = PaperRender.buildItems(PAPER.map, values, DEF.fields);
  return await PaperRender.render(PDFLib, fontkit, blank, font, PAPER.layout, items);
}
// 併願（資格外活動許可・再入国許可）の申請書PDF：「する」を選んだものだけ作る
async function makeAddonPdfs(values) {
  const out = [];
  if (typeof PAPER_X === "undefined") return out;
  for (const x of PAPER_X) {
    if (values[x.ask] !== "する") continue;
    await loadLibs(x.base);
    const [blank, font] = await Promise.all([fetchBin(x.base, x.blank), fetchBin(x.base, "ipagp.ttf")]);
    const items = PaperRender.buildItems(x.map, values, DEF.fields);
    out.push({suffix: x.suffix, bytes: await PaperRender.render(PDFLib, fontkit, blank, font, x.layout, items)});
  }
  return out;
}
async function save() {
  const values = collect();
  const probs = checkAll();
  const nameF = DEF.fields.find(f => /氏名/.test(f.label));
  const name = (nameF && values[nameF.tr]) || "未入力";
  const d = new Date(), ymd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  const data = {format: FORMAT, screen: DEF.screen, screen_key: DEF.screen_key, source_file: DEF.source_file,
    saved_at: d.toISOString(), open_problems: probs.length, values, fill: compile(values)};
  data.status = probs.length ? `要確認${probs.length}件` : "入力完了";
  // 保存は制限しない。足りない項目があればファイル名に件数を出す
  const base = `${name.replace(/[\\/:*?"<>|\s]+/g, "_")}_${DEF.short || DEF.screen_key}_${ymd}${probs.length ? `_要確認${probs.length}件` : ""}`;
  download(new Blob([JSON.stringify(data, null, 1)], {type: "application/json"}), base + ".json");
  const st = $("#status");
  const note = document.createElement("div"); note.style.marginTop = "8px"; note.style.fontWeight = "600";
  note.textContent = `保存しました：${base}.json　（申請書PDFを作成中…）`;
  st.appendChild(note);
  try {
    const pdf = await makePdf(values);
    const extra = await makeAddonPdfs(values);
    for (const x of extra) download(new Blob([x.bytes], {type: "application/pdf"}), base + x.suffix + ".pdf");
    const ex = extra.map(x => `${base}${x.suffix}.pdf`);
    if (pdf || extra.length) { if (pdf) download(new Blob([pdf], {type: "application/pdf"}), base + ".pdf");
      note.textContent = `保存しました：${[base + ".json"].concat(pdf ? [base + ".pdf"] : [], ex).join(" と ")}　→ JSONはZohoの申請履歴に上げ直してください（古いファイルは削除）。`; }
    else note.textContent = `保存しました：${base}.json　→ Zohoの申請履歴に上げ直してください（古いファイルは削除）。`;
  } catch (e) {
    note.textContent = `保存しました：${base}.json　※申請書PDFは作れませんでした（${e.message}）`;
  }
}
function load(data) {
  if (data.format !== FORMAT) { alert("このフォーム用のファイルではありません"); return; }
  if (data.screen_key !== DEF.screen_key) { if (!confirm(`別の申請種類（${data.screen}）のファイルです。読み込みますか？`)) return; }
  DEF.fields.forEach(f => setVal(f, data.values[f.tr]));
  document.querySelectorAll("section.sec").forEach(s => { if ([...s.querySelectorAll(".row.extra")].some(r => { const f = DEF.fields.find(x => x.tr === r.dataset.tr); return !empty(getVal(f)); })) s.classList.add("showextra"); });
  applyDeps(); checkAll();
}

build(); applyDeps();
if (DEF.version) $("#ver").textContent = DEF.version;
if (DEF.site) $("#toIndex").style.display = "";
$("#btnSave").onclick = () => save();
$("#btnCheck").onclick = checkAll;
$("#btnClear").onclick = () => { if (confirm("入力内容をすべて消しますか？")) { build(); applyDeps(); $("#status").className = ""; $("#status").textContent = ""; } };
$("#fileOpen").onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => load(JSON.parse(t))).catch(err => alert("読み込めません: " + err.message)); e.target.value = ""; };
</script>
</body>
</html>
